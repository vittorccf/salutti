name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Mesmo fuso da Vercel: as datas não podem depender do fuso do servidor.
      TZ: UTC
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes unitários
        run: npm test

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta (build de produção)
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: test-results
          retention-days: 7
